# Dependency cooldown (RFC 3923, stable since Cargo 1.100): when selecting
# versions, the resolver ignores crate versions published less than 3 days
# ago, unless the version is already recorded in Cargo.lock. This gives
# malicious or broken releases time to be
# spotted and yanked before an update here can pick them up. Versions without
# a publish timestamp in the registry index, git dependencies, and path
# dependencies are not affected.
#
# One sharp edge: with a cold registry cache, Cargo also *verifies* an
# existing lockfile against this setting, so a build fails while any locked
# version is younger than 3 days. That state arises when a version was locked
# before this file existed, or via the bypass below. CI therefore sets
# CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow (see ci.yml): CI builds the
# reviewed lockfile as-is, while version *selection* (cargo update / add) on
# a developer machine stays governed by the cooldown.
#
# To take a version that is younger than the cooldown anyway (for example an
# urgent security fix), bypass it for that one update:
#
#   CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate> --precise <version>
[registry]
global-min-publish-age = "3 days"
