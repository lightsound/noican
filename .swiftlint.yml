strict: true

included:
  - macos/Sources/NoicanMenuBar
  - macos/NoicanState/Sources/NoicanState
  - macos/NoicanState/Tests/NoicanStateTests

# The reducer's event dispatch is one exhaustive switch by design (every
# event visibly routed in one place); counting its cases as complexity
# would punish exactly that shape. Non-switch branching keeps the default
# thresholds.
cyclomatic_complexity:
  ignores_case_statements: true

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - uid

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 700
  # This codebase deliberately carries heavy rationale comments (real-time
  # rules, state-machine invariants). Counting them against file length
  # would reward deleting documentation; the limit is meant to bound code.
  ignore_comment_only_lines: true

reporter: xcode
