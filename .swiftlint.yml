# Same policy as the Rust side: everything starts as an error, and CI runs
# `swiftlint --strict` so warnings fail too. Exceptions are listed here only
# when a rule cannot be satisfied, with the reason next to it.

included:
  - apps/NoicanMenuBar/Sources

excluded:
  - apps/NoicanMenuBar/.build

opt_in_rules:
  - all

disabled_rules:
  # Directly contradicts `opening_brace`, a default rule: one wants `{` on the
  # declaration's line, the other on its own. `opening_brace` matches the
  # official Swift style and every Apple sample, so it is the one kept.
  - contrasted_opening_brace
  # Contradicts `redundant_type_annotation`, and demands an annotation on every
  # local binding, which fights Swift's type inference everywhere rather than
  # only where the type is unclear. `redundant_type_annotation` is the one kept.
  - explicit_type_interface
  # Forbids `guard let x else { return }` on one line, which is the most
  # idiomatic construct in the language.
  - conditional_returns_on_newline
  # Prescribes a fixed order for the members of a type. SwiftUI views read best
  # grouped by what they render — `body` and the view fragments it composes
  # together, then the bindings — which this rule forbids.
  - type_contents_order
  - file_types_order
  # Requires a doc comment on every declaration including private helpers and
  # trivial computed properties, which buries the comments that matter.
  - missing_docs
  # Wants every file to open with the same licence header; the licence lives in
  # one place at the repository root instead.
  - file_header
  # Demands an explicit ACL on every declaration, including the many that are
  # correctly internal.
  - explicit_acl
  - explicit_top_level_acl
  # SwiftUI view bodies are declarative trees, and splitting them to satisfy a
  # length limit makes them harder to read, not easier.
  - closure_body_length
  # `@Observable` generates the initialisers this rule wants written by hand.
  - explicit_init
  # Would forbid the `guard let x else { return }` shorthand this code relies on.
  - prefer_nimble
  - no_magic_numbers

line_length:
  warning: 100
  error: 100
  ignores_comments: false

type_body_length:
  warning: 320
  error: 320

file_length:
  warning: 400
  error: 400

identifier_name:
  min_length: 2
