name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (all lints as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: rustdoc (lints as errors)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  deny:
    name: cargo-deny (licenses & advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: 1.98.0

  machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  macos:
    name: macOS (Rust + Swift, warnings as errors)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint the Swift control plane (strict)
        run: swiftlint lint --strict --config .swiftlint.yml
      - name: Test the state machine (reducer transition tests)
        # NoicanState is a standalone pure-Swift package, so its tests
        # need neither the Rust staticlib nor an app build.
        run: swift test --package-path macos/NoicanState
      - name: Lint the workspace on the Apple Silicon target
        run: >
          cargo clippy --workspace --all-targets --all-features --locked
          --target aarch64-apple-darwin -- -D warnings
      - name: Test on macOS
        run: cargo test --workspace --all-features --locked
      - name: Build and ad-hoc sign the menu bar app (release, warnings as errors)
        run: bash scripts/build-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: noican-macos-arm64
          path: dist/Noican.app
