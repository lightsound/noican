name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs — on macos-15 (10x per-minute billing) a stale run is
# the most expensive kind of waste there is. Pushes to main get a group of their
# own (the run id) so back-to-back merges never cancel, or displace a pending,
# main run: every commit on main keeps its own CI result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.run_id) || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # No step pushes or fetches from origin after checkout (same on every
          # job below), so the GITHUB_TOKEN does not need to stay in the
          # workspace git config.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (all lints as errors)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: rustdoc (lints as errors)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  test:
    name: tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  deny:
    name: cargo-deny (licenses & advisories)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: 1.98.0

  machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  actionlint:
    name: jactionlint (workflow lint)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # jactionlint is the only workflow linter that parses the
      # parallel:/background:/wait:/cancel: step syntax the macos job uses.
      # Needs only the checkout and fails fast; shellcheck rides along when the
      # image ships it, with an apt fallback so run: scripts are never skipped.
      - name: Lint the GitHub Actions workflows
        run: |
          scripts/install-jactionlint.sh linux-x64 "$RUNNER_TEMP/jactionlint"
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          "$RUNNER_TEMP/jactionlint/jactionlint"

  macos:
    name: macOS (Rust + Swift, warnings as errors)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The driver submodule (lightsound/noican-driver) and its nested
          # BlackHole submodule are only needed to build the virtual
          # driver, which only the macOS job does.
          submodules: recursive
          # Both submodules are public, so no token needs to persist.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
      - name: Build and ad-hoc sign the virtual driver (BlackHole fork)
        id: build-driver
        # Compile check only: coreaudiod loads Developer-ID-signed drivers,
        # so the installable artifact is built on a machine with the
        # identity (NOICAN_CODESIGN_IDENTITY), not in CI.
        # Runs in the background: the Xcode build is self-contained inside
        # external/noican-driver (its own dist/), so it shares neither the
        # cargo target/ lock nor the Swift packages' .build dirs and can
        # overlap the Swift checks and the Rust chain below. The wait
        # before the UID check is what fails the job if this build fails.
        run: bash external/noican-driver/scripts/build-driver.sh
        background: true
      # SwiftPM caches restore while the driver builds in the background.
      # swiftc --version fingerprints the toolchain: compiled modules are
      # only reusable by the same compiler, so it goes in every key.
      - name: Hash the Swift toolchain for the cache keys
        id: swift-toolchain
        run: echo "hash=$(swiftc --version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # One entry per package's .build dir, each keyed on that package's
      # manifest and Swift sources. A source change misses the primary key
      # and falls back to the newest entry built by the same toolchain
      # (restore-keys), then saves under the new key on success — the
      # cache stays warm without ever restoring one package's objects
      # into another's directory. The app package's key covers all of
      # macos/ because its NoicanState/NoicanLicensing path dependencies
      # compile into macos/.build too.
      # The `!**/.build/**` exclusions keep restored build dirs out of the
      # hashes: `.build` trees contain generated .swift files (e.g. derived
      # test runners), and the app key is evaluated after the other two
      # caches restore, so hashing them would make the key depend on
      # restore order and never exact-hit.
      # Every pattern stays under macos/: SwiftPM only reads the root
      # package's Package.resolved, and a workspace-wide `**` glob would
      # walk target/ and the driver's dist/, which the background
      # xcodebuild is writing to while these keys are evaluated.
      - uses: actions/cache@v4
        with:
          path: macos/NoicanState/.build
          key: ${{ runner.os }}-swiftpm-state-${{ steps.swift-toolchain.outputs.hash }}-${{ hashFiles('macos/NoicanState/Package.swift', 'macos/NoicanState/**/*.swift', 'macos/NoicanState/Package.resolved', '!macos/NoicanState/.build/**') }}
          restore-keys: ${{ runner.os }}-swiftpm-state-${{ steps.swift-toolchain.outputs.hash }}-
      - uses: actions/cache@v4
        with:
          path: macos/NoicanLicensing/.build
          key: ${{ runner.os }}-swiftpm-licensing-${{ steps.swift-toolchain.outputs.hash }}-${{ hashFiles('macos/NoicanLicensing/Package.swift', 'macos/NoicanLicensing/**/*.swift', 'macos/NoicanLicensing/Package.resolved', '!macos/NoicanLicensing/.build/**') }}
          restore-keys: ${{ runner.os }}-swiftpm-licensing-${{ steps.swift-toolchain.outputs.hash }}-
      - uses: actions/cache@v4
        with:
          path: macos/.build
          key: ${{ runner.os }}-swiftpm-app-${{ steps.swift-toolchain.outputs.hash }}-${{ hashFiles('macos/Package.swift', 'macos/**/*.swift', 'macos/Sources/CNoican/**', 'macos/Package.resolved', '!macos/**/.build/**') }}
          restore-keys: ${{ runner.os }}-swiftpm-app-${{ steps.swift-toolchain.outputs.hash }}-
      - name: Install SwiftLint
        run: brew install swiftlint
      # The three Swift checks are independent: swiftlint only reads
      # sources, and each swift test builds inside its own package's
      # .build dir (NoicanState and NoicanLicensing are standalone
      # packages that need neither the Rust staticlib nor an app build).
      - parallel:
          - name: Lint the Swift control plane (strict)
            run: swiftlint lint --strict --config .swiftlint.yml
          - name: Test the state machine (reducer transition tests)
            run: swift test --package-path macos/NoicanState
          - name: Test the license logic (mock backend, no network)
            run: swift test --package-path macos/NoicanLicensing
      - name: Lint the workspace on the Apple Silicon target
        run: >
          cargo clippy --workspace --all-targets --all-features --locked
          --target aarch64-apple-darwin -- -D warnings
      - name: Test on macOS
        run: cargo test --workspace --all-features --locked
      - name: Build and ad-hoc sign the menu bar app (release, warnings as errors)
        run: bash scripts/build-macos-app.sh
      - name: Wait for the driver build
        wait: build-driver
      - name: Check the driver's device UID against the app's matchers
        # The UID base is set in lightsound/noican-driver; the matchers
        # that must accept it (AudioDeviceCatalog.isNoicanVirtualDevice,
        # is_noican_loopback_uid) live here and require the
        # "com.lightsound.noican." prefix with a segment after the dot.
        run: |
          set -o pipefail
          strings external/noican-driver/dist/Noican.driver/Contents/MacOS/Noican \
            | grep -E '^com\.lightsound\.noican\..+_UID$'
      - parallel:
          - uses: actions/upload-artifact@v4
            with:
              name: noican-macos-arm64
              path: dist/Noican.app
          - uses: actions/upload-artifact@v4
            with:
              name: noican-driver-universal-adhoc
              path: external/noican-driver/dist/Noican.driver
