name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (all lints as errors)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  docs:
    name: rustdoc (lints as errors)
    runs-on: ubuntu-26.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  test:
    name: tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  deny:
    name: cargo-deny (licenses & advisories)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: 1.98.0

  machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  macos:
    name: macOS (Rust + Swift, warnings as errors)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The driver submodule (lightsound/noican-driver) and its nested
          # BlackHole submodule are only needed to build the virtual
          # driver, which only the macOS job does.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
      - name: Build and ad-hoc sign the virtual driver (BlackHole fork)
        id: build-driver
        # Compile check only: coreaudiod loads Developer-ID-signed drivers,
        # so the installable artifact is built on a machine with the
        # identity (NOICAN_CODESIGN_IDENTITY), not in CI.
        # Runs in the background: the Xcode build is self-contained inside
        # external/noican-driver (its own dist/), so it shares neither the
        # cargo target/ lock nor the Swift packages' .build dirs and can
        # overlap the Swift checks and the Rust chain below. The wait
        # before the UID check is what fails the job if this build fails.
        run: bash external/noican-driver/scripts/build-driver.sh
        background: true
      - name: Install SwiftLint
        run: brew install swiftlint
      # The three Swift checks are independent: swiftlint only reads
      # sources, and each swift test builds inside its own package's
      # .build dir (NoicanState and NoicanLicensing are standalone
      # packages that need neither the Rust staticlib nor an app build).
      - parallel:
          - name: Lint the Swift control plane (strict)
            run: swiftlint lint --strict --config .swiftlint.yml
          - name: Test the state machine (reducer transition tests)
            run: swift test --package-path macos/NoicanState
          - name: Test the license logic (mock backend, no network)
            run: swift test --package-path macos/NoicanLicensing
      - name: Lint the workspace on the Apple Silicon target
        run: >
          cargo clippy --workspace --all-targets --all-features --locked
          --target aarch64-apple-darwin -- -D warnings
      - name: Test on macOS
        run: cargo test --workspace --all-features --locked
      - name: Build and ad-hoc sign the menu bar app (release, warnings as errors)
        run: bash scripts/build-macos-app.sh
      - name: Wait for the driver build
        wait: build-driver
      - name: Check the driver's device UID against the app's matchers
        # The UID base is set in lightsound/noican-driver; the matchers
        # that must accept it (AudioDeviceCatalog.isNoicanVirtualDevice,
        # is_noican_loopback_uid) live here and require the
        # "com.lightsound.noican." prefix with a segment after the dot.
        run: >
          strings external/noican-driver/dist/Noican.driver/Contents/MacOS/Noican
          | grep -E '^com\.lightsound\.noican\..+_UID$'
      - parallel:
          - uses: actions/upload-artifact@v4
            with:
              name: noican-macos-arm64
              path: dist/Noican.app
          - uses: actions/upload-artifact@v4
            with:
              name: noican-driver-universal-adhoc
              path: external/noican-driver/dist/Noican.driver
