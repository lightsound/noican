name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      - name: Cache checksum-verified public model assets
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/noican-model-cache
          key: noican-models-${{ runner.os }}-${{ hashFiles('crates/noican-models/src/assets.rs') }}
      - name: Run public-model WAV inference smoke test
        run: |
          cargo run --locked -- process fixtures/sample-noisy.wav \
            --model fastenhancer-t,fastenhancer-b,fastenhancer-s,dpdfnet2-48khz-hr,dpdfnet8-48khz-hr,deepfilternet3,ul-unas,hush \
            --model-dir "${RUNNER_TEMP}/noican-model-cache" \
            --output-dir "${RUNNER_TEMP}/noican-output"
          python3 scripts/verify-comparison.py \
            "${RUNNER_TEMP}/noican-output/sample-noisy-e5149090/comparison.json" \
            --expect fastenhancer-t,fastenhancer-b,fastenhancer-s,dpdfnet2-48khz-hr,dpdfnet8-48khz-hr,deepfilternet3,ul-unas,hush
      - name: Audit licenses, advisories, dependencies, and sources
        run: cargo deny --locked check
      - name: Reject unused dependencies
        run: cargo machete

  macos:
    name: Apple Silicon app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint Swift control plane strictly
        run: swiftlint lint --strict --config .swiftlint.yml
      - name: Lint macOS Rust targets
        run: cargo clippy --locked --target aarch64-apple-darwin --package noican-coreaudio --package noican-ffi --all-features
      - name: Build and ad-hoc sign menu bar app
        run: bash scripts/build-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: noican-macos-arm64
          path: dist/noican.app
