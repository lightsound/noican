[package]
name = "noican"
description = "Command-line interface for noican audio processing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hound = "3.5.1"
noican-engine = { version = "0.1.0", path = "../noican-engine" }
noican-models = { version = "0.1.0", path = "../noican-models" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
