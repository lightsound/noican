[package]
name = "noican-models"
description = "Model registry, weight fetching, and ONNX-based stage implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["download"]
# HTTP weight downloading (ureq/rustls). Disabled by the FFI/app build,
# which only reads already-downloaded files.
download = ["dep:ureq", "dep:sha2"]

[dependencies]
noican-core = { workspace = true }
thiserror = { workspace = true }
ort = { workspace = true }
ureq = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
realfft = { workspace = true }
deep_filter = { workspace = true }
ndarray = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# The deep_filter package exposes its library as `df`, which cargo-machete
# does not associate with the package name.
ignored = ["deep_filter"]
